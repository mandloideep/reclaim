version: "2"
linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - revive
    - errorlint
    - nilerr
    - bodyclose
    - noctx
    - prealloc
    - unconvert
    - unparam
    - modernize
formatters:
  enable:
    - gofmt
    - goimports
